[package]
name = "clawsharp-desktop"
version = "0.1.0"
description = "ClawSharp desktop shell built with Tauri"
authors = ["ClawSharp"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.8.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
